name: Build and publish PHP image

# Construit l'image consommee par les builds du serveur (FROM .../versions-dev/php:<tag>).
# Le tag "master" est celui de la production : il n'est pousse que sur demande explicite.

on:
  push:
    branches:
      - "php/8.4-ffi-chunkutils"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de l'image versions-dev/php"
        required: true
        default: "chunkutils"

jobs:
  image:
    name: PHP image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Plutonium Registry
        uses: docker/login-action@v3
        with:
          registry: registry.plutonium.best
          username: ${{ secrets.PLUTONIUM_REGISTRY_USERNAME }}
          password: ${{ secrets.PLUTONIUM_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.image
          platforms: linux/amd64
          push: true
          tags: registry.plutonium.best/versions-dev/php:${{ inputs.tag || 'chunkutils' }}
